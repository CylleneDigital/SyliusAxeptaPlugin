<svg xmlns="http://www.w3.org/2000/svg" width="680" height="272" viewBox="0 0 680 272" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Sylius Axepta BNP Paribas Plugin</title>
<desc>Bandeau du plugin : paiement par carte Axepta BNP Paribas pour Sylius 2, par les chemins Payum et PaymentRequest, signe par le monogramme Cyllene</desc>
<defs>
<clipPath id="ax-cp"><rect width="680" height="272" rx="14"/></clipPath>
<linearGradient id="ax-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#123F72"/><stop offset="1" stop-color="#14487F"/>
</linearGradient>
<linearGradient id="ax-card" x1="0" y1="0" x2="0.8" y2="1">
<stop offset="0" stop-color="#0E2A4A"/><stop offset="1" stop-color="#0A1D35"/>
</linearGradient>
</defs>
<g clip-path="url(#ax-cp)">
<rect width="680" height="272" fill="url(#ax-bg)"/>

<g opacity="0.10" stroke="#FFFFFF" stroke-width="1" fill="none">
  <circle cx="538" cy="136" r="88"/><circle cx="538" cy="136" r="124"/><circle cx="538" cy="136" r="160"/>
</g>

<rect x="48" y="70" width="4" height="132" rx="2" fill="#8FC0F2"/>

<text x="74" y="106" font-size="31" font-weight="600" fill="#FFFFFF">Sylius Axepta Plugin</text>
<text x="74" y="138" font-size="15" fill="#BBD6F4">BNP Paribas card payment, hosted by the bank</text>

<g font-size="12" fill="#CFE3F8" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="74" y="162" width="98" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="123" y="179" text-anchor="middle">Payum</text>
  <rect x="180" y="162" width="146" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="253" y="179" text-anchor="middle">PaymentRequest</text>
</g>

<text x="74" y="216" font-size="12" fill="#9CC2EA" font-family="ui-monospace, Menlo, Consolas, monospace">MIT · PHP 8.2+ · Sylius 2.1+ · HMAC-SHA256</text>

<g transform="translate(442 80)">
  <rect width="188" height="116" rx="12" fill="url(#ax-card)" stroke="#4E8FD4" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="1" y="26" width="186" height="18" fill="#08172B" opacity="0.75"/>
  <rect x="18" y="62" width="32" height="23" rx="4" fill="#E8C877" opacity="0.92"/>
  <path d="M34 62v23M18 70h32M18 77h32" stroke="#B99B4E" stroke-width="0.6"/>
  <rect x="18" y="62" width="32" height="23" rx="4" fill="none" stroke="#B99B4E" stroke-width="0.6"/>
  <rect x="64" y="68" width="24" height="5" rx="2.5" fill="#CFE0F5" opacity="0.8"/>
  <rect x="94" y="68" width="24" height="5" rx="2.5" fill="#CFE0F5" opacity="0.55"/>
  <rect x="124" y="68" width="24" height="5" rx="2.5" fill="#CFE0F5" opacity="0.4"/>
  <rect x="18" y="97" width="70" height="5" rx="2.5" fill="#CFE0F5" opacity="0.4"/>
  <g transform="translate(150 60)" stroke="#CFE0F5" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M0 4a7 7 0 0 1 0 12"/>
    <path d="M6 0a13 13 0 0 1 0 20"/>
    <path d="M12 -4a19 19 0 0 1 0 28"/>
  </g>
</g>

<image href="data:image/png;base64," x="596" y="34" height="28" opacity="0.9"/>
</g>
</svg>
