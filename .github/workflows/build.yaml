name: Build

on:
    # No `paths-ignore` on `pull_request`: `Build complete` is a required check, and a required
    # check that never starts blocks the pull request for good rather than letting a documentation
    # change through. A run on a `.md` file costs three minutes; a rule that has to be bypassed by
    # hand costs the rule itself.
    #
    # `push` is limited to `main` so that a branch does not run the matrix twice, once for the push
    # and once for its pull request.
    #
    # ⚠️ Blind spot of the path filters, kept in mind for the schedule: on a push replacing one
    # history with another without a common ancestor - an orphan branch force-pushed, for instance -
    # GitHub computes no list of changed files. `workflow_dispatch` is then the only way out, and it
    # only appears in the interface if this file already exists on the default branch.
    push:
        branches:
            - main
    pull_request: ~
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        # Pinned rather than `ubuntu-latest`: the build action is only known to work on this image.
        runs-on: ubuntu-24.04
        # A stuck browser would otherwise hold the runner for the 6-hour default.
        timeout-minutes: 30

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                # PHP 8.5 is in the matrix although the skeleton stops at 8.3: the first project
                # that will install this plugin runs on it. Should it break on a third-party
                # dependency rather than on our code, move the line to `continue-on-error` with a
                # comment - do not drop it from the matrix.
                php: ["8.2", "8.3", "8.4", "8.5"]
                symfony: ["^6.4", "^7.4", "^8.0"]
                # The floor is 2.1 rather than 2.0 for two reasons lying with Sylius itself. Its
                # Behat cart context did not restore the security token before 2.1, so a scenario
                # logging the customer in before filling their cart cannot pass on 2.0. And 2.0
                # pins Behat versions predating PHP 8.5, which Composer therefore cannot install
                # together.
                sylius: ["~2.1.0", "~2.2.0", "~2.3.0"]
                # The plugin creates no table and writes no query: a single database is enough on
                # the main matrix. The cycles saved cover 4 PHP versions.
                database: ["mysql:8.4"]
                node: ["22.x"]
                # Sylius 2.3 needs PHP 8.3 and is the only one to support Symfony 8, which needs
                # PHP 8.4. Symfony 6.4 is covered by Sylius 2.1 and 2.2: running it on 2.3 as well
                # would cost three jobs for a combination no new project picks.
                exclude:
                    - sylius: "~2.1.0"
                      symfony: "^8.0"
                    - sylius: "~2.2.0"
                      symfony: "^8.0"
                    - sylius: "~2.3.0"
                      symfony: "^6.4"
                    - sylius: "~2.3.0"
                      php: "8.2"
                    - symfony: "^8.0"
                      php: "8.3"

                include:
                    # The build action declares MariaDB with a bare version, which DBAL reads as
                    # MySQL: that is what the Sylius 2.3 migrations need, they skip a database
                    # declared as MariaDB.
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "mariadb:11.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:17"
                      node: "22.x"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v7

            # Sylius 2.1 / 2.2 declare their Behat steps in annotations, which Behat 4 no longer reads;
            # Composer would still pick Behat 4 for them.
            -
                name: Keep Behat 3 before Sylius 2.3
                if: matrix.sylius != '~2.3.0'
                run: composer require --dev --no-update --no-interaction "behat/behat:^3.22" "friends-of-behat/mink-extension:^2.7"

            # Sylius 2.1 mappings fail ORM 3.7 validation (ShipmentUnit#shipment vs Shipment#units).
            -
                name: Keep Doctrine ORM below 3.7 before Sylius 2.3
                if: matrix.sylius != '~2.3.0'
                run: composer require --no-update --no-interaction "doctrine/orm:^2.20 || >=3.6 <3.7"

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@fbdfc158a99f540fc3bbe554b46120d14444f2f4 # v4.3.0
                with:
                    # The Behat scenarios open no browser - `symfony` session, no `@javascript`
                    # tag - but the admin pages render the Webpack Encore entries: without a
                    # front-end build they answer 500 without saying why.
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    # The PHP-FPM worker behind `symfony server:start` segfaulted at random under OPcache
                    # (Behat 502, "child exited on signal 11"): Behat does not need it.
                    opcache_enable: "no"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            # Cheapest first: the cryptography runs in hundredths of a second and catches the most
            # serious regressions.
            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            # Catches wiring errors before the tests that depend on them: on a plugin, that is the
            # most frequent class of bug.
            -
                name: Validate container
                run: vendor/bin/console lint:container --env=test

            # Sylius encrypts the gateway configuration: without this key, every test writing to
            # the database fails on "Cannot read keyfile", an error that does not say its name.
            -
                name: Generate the payment encryption key
                run: vendor/bin/console sylius:payment:generate-key

            # Static analysis and the coding standard do not depend on the database nor on the PHP
            # version line under test, so they only run once, on the primary job.
            -
                name: Run PHPStan
                if: matrix.php == '8.4' && matrix.symfony == '^7.4' && matrix.sylius == '~2.3.0' && matrix.database == 'mysql:8.4'
                run: vendor/bin/phpstan analyse --ansi --no-progress

            -
                name: Run ECS
                if: matrix.php == '8.4' && matrix.symfony == '^7.4' && matrix.sylius == '~2.3.0' && matrix.database == 'mysql:8.4'
                run: vendor/bin/ecs check --ansi --no-progress-bar

            -
                name: Run non-unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -
                name: Run Behat
                run: vendor/bin/behat --colors --strict --no-interaction -f progress

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    # No colon: `upload-artifact` rejects them, and `matrix.database` carries one.
                    # The name must also discriminate Symfony, otherwise two jobs of the matrix
                    # fight over the same artifact. `job-index` guarantees uniqueness.
                    name: "behat-logs-sylius${{ matrix.sylius }}-symfony${{ matrix.symfony }}-php${{ matrix.php }}-job${{ strategy.job-index }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true

    # The matrix jobs carry generated names, which change with the matrix itself. This one has a
    # fixed name and is the only check the branch rule has to require.
    #
    # `always()` matters: without it the job is skipped when a matrix job fails, and a skipped
    # required check counts as satisfied - the rule would let through exactly what it guards
    # against.
    build:
        runs-on: ubuntu-24.04
        name: "Build complete"
        needs: tests
        if: always()

        steps:
            -
                name: Fail unless every matrix job succeeded
                run: |
                    [ "${{ needs.tests.result }}" = "success" ] || exit 1
