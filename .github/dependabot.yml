version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 10
  groups:
    composer:
      patterns: ["*"]
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
