version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 10
  groups:
    composer:
      patterns: ["*"]
      update-types: [minor, patch]
  ignore:
  # PHPUnit 12 requires PHP 8.3 and PHPUnit 13 PHP 8.4, and the plugin still supports PHP 8.2.
  - dependency-name: phpunit/phpunit
    versions: [">=12"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
